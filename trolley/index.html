<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="https://fav.farm/💩" />
        <link rel="stylesheet" href="style.css">
        <title>The Trolley Problem</title>
    </head>
    <body>
        <div id="title-screen">
            <h1>THE TROLLEY PROBLEM</h1>
            <div class="subtitle">A philosophical simulation</div>
            <div class="start-prompt">[ PRESS SPACE TO BEGIN ]</div>
        </div>
        <div id="hud">
            <div id="prompt-text"></div>
            <div id="spacebar-hint">
                <span class="key">SPACE</span>
                <span>PULL THE LEVER</span>
            </div>
        </div>
        <div id="outcome-overlay">
            <div id="outcome-title"></div>
            <div id="outcome-body"></div>
            <button id="restart-btn" onclick="location.reload()">[ FACE IT AGAIN ]</button>
        </div>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
        <script src="script.js"></script>
    </body>
</html>
